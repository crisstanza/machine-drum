<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Machine Drum</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/github.css" />
    <link rel="stylesheet" href="css/css.css" />
    <script type="module" src="js/index.mjs"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <br />
    <section class="songs">
      <select id="available-songs" disabled>
        <option>loading</option>
      </select>
      <div class="song-info loading" id="song-info">
        <span>Duration:</span>
        <span id="song-duration"></span>
        <span>BPM:</span>
        <span id="song-speed"></span>
        <span>Name:</span>
        <span id="song-name"></span>
        <span>Genre:</span>
        <span id="song-genre"></span>
        <span>Key:</span>
        <span id="song-key"></span>
      </div>
    </section>
    <section class="songs">
      <div class="song-info-dynamic loading" id="song-info-dynamic">
        <span>Tracks:</span>
        <span id="song-tracks"></span>
        <span>Repeat?</span>
        <span><input type="checkbox" id="song-repeat" /></span>
      </div>
    </section>
    <section class="player">
      <div class="buttons">
        <input title="volume" class="volume" id="volume-control" type="range" min="0" max="1" step="0.01" value="0.5" />
        <button title="play" id="play-button" disabled>▶️</button>
        <button title="pause" id="pause-button" disabled>⏸️</button>
        <button title="stop" id="stop-button" disabled>⏹️</button>
      </div>
      <div class="progress">
        <span>00:00</span>
        <input title="song progress" class="progress" id="song-progress" type="range" min="0" max="0" step="1" value="0" />
        <span id="song-position">00:00</span>
      </div>
    </section>
    <section class="download">
      <div class="loading" id="song-download">
        <a title="download" id="song-download-link">download</a>
      </div>
    </section>
    <footer>
      <a title="source code on GitHub" target="_blank" href="https://github.com/crisstanza/machine-drum/">
        <img src="img/github.png" width="32" height="32" class="github-icon" />
      </a>
    </footer>
  </body>
</html>
