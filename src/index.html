<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Machine Drum</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/css.css" />
    <script type="module" src="js/index.mjs"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <section class="songs">
      <select id="available-songs" disabled>
        <option>loading</option>
      </select>
      <div class="song-info loading" id="song-info">
        <span>Duration:</span>
        <span id="song-duration"></span>
        <span>BPM:</span>
        <span id="song-speed"></span>
        <span>Name:</span>
        <span id="song-name"></span>
        <span>Genre:</span>
        <span id="song-genre"></span>
        <span>Repeat?</span>
        <span><input type="checkbox" id="song-repeat" /></span>
      </div>
    </section>
    <section class="player">
      <div class="buttons">
        <button title="play" id="play-button" disabled>▶️</button>
        <button title="stop" id="stop-button" disabled>⏹️</button>
      </div>
      <div class="volume">
        <input title="volume" id="volume-control" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>
    </section>
  </body>
</html>
