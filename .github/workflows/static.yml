name: Deploy static content

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PREFIX: ${{ github.workspace }}/.npm-global
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Adicionar npm global ao PATH
        run: echo "${{ github.workspace }}/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache do TypeScript instalado
        id: cache-tsc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.npm-global
          key: ${{ runner.os }}-tsc-${{ hashFiles('.bash') }}

      - name: Instalar dependências (apenas se não houver cache)
        if: steps.cache-tsc.outputs.cache-hit != 'true'
        run: |
          chmod +x ./.bash
          ./.bash installDeps

      - name: Build static content
        run: |
          chmod +x ./.bash
          ./.bash build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "build"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
